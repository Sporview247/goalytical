name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy requests
      - run: python scripts/pipeline.py
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Save data files
        run: |
          git config user.name "goalytical-bot"
          git config user.email "goalytical-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data"
          git pull --rebase
          git push
