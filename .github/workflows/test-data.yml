name: Test data connection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check football-data.co.uk files
        run: |
          for u in \
            "https://www.football-data.co.uk/mmz4281/2627/E0.csv" \
            "https://www.football-data.co.uk/mmz4281/2526/E0.csv" \
            "http://www.football-data.co.uk/mmz4281/2627/E0.csv" \
            "https://www.football-data.co.uk/fixtures.csv" \
            "https://www.football-data.co.uk/englandm.php"; do
            code=$(curl -sS -L -A "Mozilla/5.0 (compatible; GoalyticalBot/1.0)" -o out.tmp -w "%{http_code}" "$u" || echo "curl-failed")
            echo "$code  $(wc -c < out.tmp 2>/dev/null) bytes  $u"
            head -c 150 out.tmp | tr '\n' ' '
            echo
            rm -f out.tmp
          done
