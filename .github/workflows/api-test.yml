name: API test
on:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy requests
      - run: python scripts/api_test.py
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
